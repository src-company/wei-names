name = "weilimo-gateway"
main = "worker.js"
compatibility_date = "2024-01-01"

# Wildcard routes: every subdomain of these zones that lacks a more specific
# record hits this Worker. Explicit routes (e.g. api.zfi.wei.is/*) and explicit
# DNS records still win by specificity, so app subdomains are never shadowed.
# Each zone listed here must be a Cloudflare zone for the Worker path.
routes = [
  { pattern = "*.wei.limo/*", zone_name = "wei.limo" },
  { pattern = "*.wei.is/*", zone_name = "wei.is" }
]

[vars]
# Zones served (comma-separated). Matches the default in handler.js.
ZONE = "wei.limo,wei.is"
# 'redirect' (default, bandwidth-light) or 'proxy' (keeps <name>.<zone> in the
# URL bar but streams content through the Worker).
GATEWAY_MODE = "redirect"
# Comma-separated, tried in order. In `proxy` mode a 429/5xx from one entry
# falls through to the next; in `redirect` mode only the first is ever used,
# because a 302 is handed out once and cannot be taken back.
#
# The Protocol Labs fleet (ipfs.io, dweb.link, and w3s.link / nftstorage.link,
# which 301 onto dweb.link) is being retired — 429 for a growing slice of each
# hour since 2026-09-01, gone entirely on 2026-09-21 UTC. In `redirect` mode
# there is no failing over from that, so this Worker needs an entry here that
# outlives the fleet, not a longer list of it.
IPFS_SUBDOMAIN_GATEWAY = "dweb.link"
# Last-resort path gateways (`<origin>/ipfs/<cid>/<path>`), comma-separated.
# Only consulted in `proxy` mode, and only after every subdomain entry: a path
# gateway serves all CIDs from one origin and applies none of the site's own
# routing; in proxy mode the gateway reads `_redirects` itself to compensate,
# which is another reason this is ignored in `redirect` mode.
# Unset by default — `https://ipfs.io` used to sit here, which is the same fleet
# that is going away and so was never a fallback from it.
# IPFS_PATH_GATEWAY = "https://ipfs.example.org"
# Comma-separated. Leave unset to use the built-in public RPC fallback list.
# RPC_URLS = "https://eth.llamarpc.com,https://ethereum.publicnode.com"
# Extra reserved labels beyond the built-in set (www,api,zfi,multisig,...).
# RESERVED_LABELS = "srcco,docs"
