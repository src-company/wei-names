# Render Blueprint — WNS (wei name service) dapp.
#
# Serves the static dapp in dapp/ (index.html + committed vendor/ bundles).
# No build step; the app is client-side only (hash routing, public Ethereum
# RPCs, and the *.wei.domains gateway) — no backend.
#
# The dapp also stays canonical on IPFS; this is the always-on access path.
services:
  - type: web
    name: wei-dapp
    runtime: static
    staticPublishPath: dapp
    buildCommand: echo "no build — static assets are committed"
    domains:
      - wei.domains
    headers:
      # Permissive CORS so an IPFS/mirror copy can pull assets if needed.
      - path: /*
        name: Access-Control-Allow-Origin
        value: "*"
    routes:
      # SPA-style fallback for stray deep links (WNS uses #hash routing).
      - type: rewrite
        source: /*
        destination: /index.html

  # 2) WNS wildcard gateway — serves every `<name>.wei.limo` from the IPFS
  #    contenthash of `<name>.wei`, read live from the WNS contract on each
  #    request. No per-name DNS records: the `*.wei.limo` domain below points all
  #    undefined subdomains here (see gateway/README.md). Zero-dep plain ESM.
  #
  #    Note: the dapp is on wei.domains; individual .wei names resolve on wei.limo.
  #    The gateway's apex/site links already point to https://wei.domains.
  #
  #    SECURITY: keep GATEWAY_MODE=redirect. In redirect mode this service only
  #    emits a 302, so untrusted `.wei` content executes on the IPFS gateway
  #    origin — never on a *.wei.limo origin. App subdomains are reserved in
  #    handler.js (RESERVED_LABELS) and also win by DNS specificity.
  - type: web
    name: wns-gateway
    runtime: node
    rootDir: gateway
    # Always-on so a freshly registered .wei name resolves instantly with no
    # cold start. Switch to "free" to drop the ~$7/mo (spins down after 15 min).
    plan: starter
    buildCommand: echo "no build — plain ESM, zero deps"
    startCommand: node server.js
    healthCheckPath: /healthz
    domains:
      # Wildcards: catch every subdomain of wei.limo / wei.is that lacks a more
      # specific record. Render issues a wildcard TLS cert per domain (each needs
      # a DNS validation record + the *.<zone> CNAME/ALIAS at your DNS provider).
      # The gateway serves both zones (ZONE=wei.limo,wei.is in handler.js).
      - "*.wei.limo"
      - "*.wei.is"
    envVars:
      # 'redirect' (302, bandwidth-light) or 'proxy' (streams through this
      # service). Keep 'redirect'.
      - key: GATEWAY_MODE
        value: redirect
      - key: IPFS_SUBDOMAIN_GATEWAY
        value: dweb.link
      - key: IPFS_PATH_GATEWAY
        value: https://ipfs.io
      # Set to a trusted/authenticated mainnet RPC (comma-separated) so a
      # malicious public RPC can't forge a contenthash. Falls back to a built-in
      # public list if unset.
      - key: RPC_URLS
        sync: false
      # Extra reserved labels to never treat as .wei names (added to the
      # built-in www/api/zfi/multisig/srcco set). Comma-separated.
      - key: RESERVED_LABELS
        sync: false
