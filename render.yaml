# Render Blueprint — WNS (wei name service) dapp.
#
# Serves the static dapp in dapp/ (index.html + committed vendor/ bundles).
# No build step; the app is client-side only (hash routing, public Ethereum
# RPCs, and the *.wei.domains gateway) — no backend.
#
# The dapp also stays canonical on IPFS; this is the always-on access path.
services:
  - type: web
    name: wei-dapp
    runtime: static
    staticPublishPath: dapp
    buildCommand: echo "no build — static assets are committed"
    domains:
      - wei.domains
    headers:
      # Permissive CORS so an IPFS/mirror copy can pull assets if needed.
      - path: /*
        name: Access-Control-Allow-Origin
        value: "*"
    routes:
      # SPA-style fallback for stray deep links (WNS uses #hash routing).
      - type: rewrite
        source: /*
        destination: /index.html

  # 2) WNS wildcard gateway — serves every `<name>.wei.limo` from the IPFS
  #    contenthash of `<name>.wei`, read live from the WNS contract on each
  #    request. No per-name DNS records: the `*.wei.limo` domain below points all
  #    undefined subdomains here (see gateway/README.md). Zero-dep plain ESM.
  #
  #    Note: the dapp is on wei.domains; individual .wei names resolve on wei.limo.
  #    The gateway's apex/site links already point to https://wei.domains.
  #
  #    GATEWAY_MODE=proxy: the service streams IPFS content back so <name>.<zone>
  #    stays in the URL bar (no redirect). TRADE-OFF: untrusted `.wei` content
  #    then runs on a *.<zone> origin, same-site with any real apps on that zone
  #    (e.g. multisig.wei.is). Set-Cookie is stripped and nosniff is sent, but
  #    for per-CID origin isolation switch back to 'redirect'.
  - type: web
    name: wns-gateway
    runtime: node
    rootDir: gateway
    # Always-on so a freshly registered .wei name resolves instantly with no
    # cold start. Switch to "free" to drop the ~$7/mo (spins down after 15 min).
    plan: starter
    buildCommand: echo "no build — plain ESM, zero deps"
    startCommand: node server.js
    healthCheckPath: /healthz
    domains:
      # Wildcards: catch every subdomain of wei.limo / wei.is that lacks a more
      # specific record. Render issues a wildcard TLS cert per domain (each needs
      # a DNS validation record + the *.<zone> CNAME/ALIAS at your DNS provider).
      # The gateway serves every zone listed in the ZONE env var below.
      - "*.wei.limo"
      - "*.wei.is"
      # Second-level wildcards, opt-in per parent name. A TLS wildcard covers
      # exactly one label, so *.wei.limo does NOT secure send.slow.wei.limo —
      # each parent that offers sub-subdomains needs its own *.<parent>.wei.limo
      # entry (Render issues a wildcard cert per entry; add the ACME validation
      # record + a *.<parent>.wei.limo CNAME to the same target as *.wei.limo).
      # The gateway handler already resolves send.slow.wei.limo -> send.slow.wei
      # (recursive computeId), so no code change is needed — just this cert/DNS.
      #
      # GOTCHA (RFC 4592): adding *.<parent>.<zone> BREAKS <parent>.<zone> itself.
      # A wildcard only synthesizes names that don't otherwise exist; creating
      # *.slow.wei.limo makes slow.wei.limo an "empty non-terminal" (a node with
      # descendants but no records), so *.wei.limo stops covering it and it goes
      # NOERROR/NODATA. Fix: add an explicit record for the parent alongside each
      # second-level wildcard, pointing at the same target:
      #   slow.wei.limo  CNAME  wns-gateway.onrender.com.
      # The *.<zone> wildcard cert already covers the parent, so this is DNS-only.
      - "*.slow.wei.limo"
      - "*.id.wei.limo"
      # `zswap` publishes versioned builds as <NN>.zswap.wei (02.zswap.wei carries
      # its own contenthash). This entry documents state that already exists rather
      # than requesting anything new: Render has issued the *.zswap.wei.limo cert
      # and DNS answers for it, including the explicit `zswap` record the RFC 4592
      # note above requires. It was missing here while live, which is how the
      # gateway's SUBDOMAIN_PARENTS — kept in sync with this list — came to refuse it.
      - "*.zswap.wei.limo"
      # `multisig` second-level wildcard on all three zones. multisig.wei already
      # serves content via *.wei.<zone>, so per the RFC 4592 note above you MUST
      # add an explicit `multisig` CNAME on each zone at the same time, or the
      # bare multisig.wei.<zone> parents break (empty non-terminal -> NODATA).
      - "*.multisig.wei.limo"
      - "*.multisig.wei.is"
      # wei.domains subdomains resolve .wei content too (the apex wei.domains
      # stays on the wei-dapp service above — an explicit host beats a wildcard).
      # <name>.wei.domains -> contenthash of <name>.wei, same as *.wei.limo.
      # Single level only: a wildcard cert covers one label, so send.slow.wei.domains
      # would need its own *.slow.wei.domains entry (intentionally not added).
      - "*.wei.domains"
      # Opt-in second-level wildcard for the `id` parent on wei.domains
      # (<x>.id.wei.domains -> <x>.id.wei), mirroring *.id.wei.limo above.
      - "*.id.wei.domains"
      # `multisig` second-level wildcard on wei.domains (add explicit multisig
      # CNAME alongside it — see the RFC 4592 note above).
      - "*.multisig.wei.domains"
    envVars:
      # Zones this gateway resolves (comma-separated). Must include every zone
      # whose *.<zone> wildcard points here. Mirrors the handler.js default.
      - key: ZONE
        value: wei.limo,wei.is,wei.domains
      # 'proxy' (streams through this service; keeps <name>.<zone> in the URL
      # bar) or 'redirect' (302, bandwidth-light, per-CID origin isolation).
      - key: GATEWAY_MODE
        value: proxy
      # Subdomain gateway used in both modes. Must be subdomain (not path) form
      # so the site's _redirects/SPA fallback applies — deep paths like /docs
      # 404 on a path gateway (ipfs.io/ipfs/<cid>/docs) even when / works.
      - key: IPFS_SUBDOMAIN_GATEWAY
        value: dweb.link
      # web3:// HTTP gateway for on-chain (ERC-4804) dapps in `auto`/`manual`
      # mode, where serving means translating a URL into calldata:
      # https://<addr>.<WEB3_CHAIN_ID>.<WEB3_GATEWAY><path>.
      #
      # NOT used for resolveMode() = "5219" (ERC-5219) or ERC-8244 html():
      # those the gateway reads and serves itself, straight from the contract,
      # honouring the contract's own Content-Type and Cache-Control. That path
      # ignores GATEWAY_MODE — this service is always in the data path for it,
      # and a page is a whole document per request (zswap.wei is ~245 KB), so
      # size the plan for the response bytes rather than for 302s.
      - key: WEB3_GATEWAY
        value: w3link.io
      - key: WEB3_CHAIN_ID
        value: "1"
      # Per-endpoint timeout for contract page reads (request()/html()), which
      # return whole documents. Registry lookups keep the shorter 5s budget.
      - key: PAGE_TIMEOUT_MS
        value: "15000"
      # STRONGLY RECOMMENDED: set this in the Render dashboard (it is `sync:
      # false` precisely so the key never lands in this file or in git).
      #
      # Two reasons, one of which is now load-bearing:
      #   - trust: a malicious public RPC can forge a contenthash or a page body.
      #   - capacity: contract pages are whole documents per read (zswap.wei is
      #     ~240 KB). The built-in public endpoints rate-limit well before real
      #     traffic does, and a rate-limited gateway 502s. An authenticated
      #     endpoint (e.g. https://mainnet.gateway.tenderly.co/<key>) does not.
      # Comma-separated; the gateway rotates across them, benches endpoints that
      # fail or rate-limit for 30s, and caps concurrent calls.
      - key: RPC_URLS
        sync: false
      # NOTE: there was briefly a SUBDOMAIN_PARENTS var here listing which
      # parents could serve <x>.<parent>.<zone>. It is gone, and the gateway no
      # longer reads it — the chain is the authority on which names exist.
      # If your service still has one set from an earlier deploy it is inert,
      # but delete it anyway so nobody trusts it. It took down 02.zswap.wei and
      # token.list.wei: a list of names in config drifts the moment one is
      # registered, and removing it from this file did not unset it on the
      # running service.
      # Labels to never treat as .wei names, comma-separated. The built-in
      # reserved set in handler.js is currently EMPTY, so e.g. www.wei.domains
      # resolves www.wei unless you list `www` here (applies to every zone).
      - key: RESERVED_LABELS
        sync: false
